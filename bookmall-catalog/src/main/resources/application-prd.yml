bookmall:
  jwt:
    secret: ${BOOKMALL_JWT_SECRET}

spring:
  data:
    redis:
      host: ${BOOKMALL_REDIS_HOST:127.0.0.1}
      port: ${BOOKMALL_REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bookmall_book
    username: bookmall_book_app
    password: ${BOOKMALL_BOOK_DB_PASSWORD}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
      export:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
