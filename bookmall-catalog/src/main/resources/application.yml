server:
  port: 8082

spring:
  profiles:
    default: dev
  application:
    name: bookmall-catalog
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
