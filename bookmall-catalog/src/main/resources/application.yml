server:
  port: 8082

bookmall:
  baike:
    app-id: ${BAIKE_APP_ID:379020}
    card-url: https://baike.baidu.com/api/openapi/BaikeLemmaCardApi
    timeout: 3s
    excerpt-length: 600
  compare:
    max-titles: 20
    parallelism: 4
    deadline: 20s
    permit-wait: 15s
  cache:
    book-ttl: 60s

spring:
  profiles:
    default: dev
  application:
    name: bookmall-catalog
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  health:
    mongo:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false
