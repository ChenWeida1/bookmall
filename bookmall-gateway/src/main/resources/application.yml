server:
  port: 8080

spring:
  profiles:
    default: dev
  application:
    name: bookmall-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: users
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: catalog
          uri: http://localhost:8082
          predicates:
            - Path=/api/categories,/api/books/**
        - id: admin-orders
          uri: http://localhost:8083
          predicates:
            - Path=/api/admin/orders/**
        - id: admin-notifications
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/notifications/**
        - id: catalog-admin
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/**
        - id: orders
          uri: http://localhost:8083
          predicates:
            - Path=/api/cart/**,/api/orders/**
        - id: notifications
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
        - id: assistant
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/api/assistant/**
      httpclient:
        response-timeout: 90s

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false
