server:
  port: 8084

spring:
  profiles:
    default: dev
  application:
    name: bookmall-notification
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  rabbitmq:
    listener:
      simple:
        # 拒绝后不重新入队，配合队列死信参数进入死信队列。
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
