# 纸间书店第二版：依赖与后端一键启动。
# 用途：本地联调 Postgres / Redis / RabbitMQ + 五服务 + 前端静态资源（可选）。
# 与一期差异：增加 Redis:6379、RabbitMQ:5672/15672；通知走 MQ。
#
# 用法（仓库根目录）：
#   docker compose up -d postgres redis rabbitmq
#   # 初始化库见 README / docs/数据库设置.md（含 07-phase2-*.sql）
#   docker compose up -d --build
#
# 网关对外 http://localhost:8080 ，前端开发仍可用 npm run dev（5173）。

services:
  postgres:
    image: postgres:16
    container_name: bookmall-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bookmall-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 图书列表/分类短 TTL 缓存
  redis:
    image: redis:7-alpine
    container_name: bookmall-redis
    ports:
      - "6379:6379"

  # 订单通知交换机 bookmall.notification
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: bookmall-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 仅 Compose 与本机开发使用。生产 systemd 与 Kubernetes 不部署注册中心。
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: bookmall-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"

  user:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-user
    container_name: bookmall-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      ZIPKIN_EXPORT_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmall_user
      SPRING_DATASOURCE_USERNAME: bookmall_user_app
      SPRING_DATASOURCE_PASSWORD: bookmall_user_dev
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started

  catalog:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-catalog
    container_name: bookmall-catalog
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmall_book
      SPRING_DATASOURCE_USERNAME: bookmall_book_app
      SPRING_DATASOURCE_PASSWORD: bookmall_book_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SEATA_ADDR: seata:8091
      ZIPKIN_EXPORT_ENABLED: "true"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_started
      seata:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-order
    container_name: bookmall-order
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmall_order
      SPRING_DATASOURCE_USERNAME: bookmall_order_app
      SPRING_DATASOURCE_PASSWORD: bookmall_order_dev
      BOOKMALL_NOTIFICATION_BASE_URL: http://notification:8084
      BOOKMALL_NACOS_ADDR: nacos:8848
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SEATA_ADDR: seata:8091
      ZIPKIN_EXPORT_ENABLED: "true"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      catalog:
        condition: service_started
      nacos:
        condition: service_started
      seata:
        condition: service_started

  notification:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-notification
    container_name: bookmall-notification
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmall_notification
      SPRING_DATASOURCE_USERNAME: bookmall_notification_app
      SPRING_DATASOURCE_PASSWORD: bookmall_notification_dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ZIPKIN_EXPORT_ENABLED: "true"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      nacos:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-gateway
    container_name: bookmall-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      BOOKMALL_NACOS_ADDR: nacos:8848
      ZIPKIN_EXPORT_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - user
      - catalog
      - order
      - notification
      - assistant
      - nacos

  assistant:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        MODULE: bookmall-assistant
    container_name: bookmall-assistant
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmall_assistant
      SPRING_DATASOURCE_USERNAME: bookmall_assistant_app
      SPRING_DATASOURCE_PASSWORD: bookmall_assistant_dev
      BOOKMALL_CATALOG_BASE_URL: http://catalog:8082
      BOOKMALL_NACOS_ADDR: nacos:8848
      ZIPKIN_EXPORT_ENABLED: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_MODEL: ${AI_MODEL:-glm-4.7}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      nacos:
        condition: service_started

  seata:
    image: apache/seata-server:2.1.0
    container_name: bookmall-seata
    environment:
      SEATA_PORT: "8091"
      SEATA_STORE_DB_URL: jdbc:postgresql://postgres:5432/bookmall_seata
      SEATA_STORE_DB_USER: bookmall_seata_app
      SEATA_STORE_DB_PASSWORD: bookmall_seata_dev
    volumes:
      - ./deploy/seata/application.yml:/seata-server/resources/application.yml
    ports:
      - "8091:8091"
      - "7091:7091"
    depends_on:
      postgres:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: bookmall-zipkin
    ports:
      - "9411:9411"

volumes:
  bookmall-pg:
