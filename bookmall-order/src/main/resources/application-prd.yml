bookmall:
  jwt:
    secret: ${BOOKMALL_JWT_SECRET}
  catalog-base-url: ${BOOKMALL_CATALOG_BASE_URL:http://127.0.0.1:8082}
  notification-base-url: ${BOOKMALL_NOTIFICATION_BASE_URL:http://127.0.0.1:8084}

spring:
  rabbitmq:
    host: ${BOOKMALL_RABBITMQ_HOST:127.0.0.1}
    port: ${BOOKMALL_RABBITMQ_PORT:5672}
    username: ${BOOKMALL_RABBITMQ_USER:guest}
    password: ${BOOKMALL_RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bookmall_order
    username: bookmall_order_app
    password: ${BOOKMALL_ORDER_DB_PASSWORD}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
      export:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
