server:
  port: 8083

bookmall:
  # 待支付超时。开发环境在 application-dev.yml 里改成 1 分钟。
  pay-timeout: 15m
  catalog-connect-timeout: 3s
  catalog-read-timeout: 3s
  notification-timeout: 1s

spring:
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
  profiles:
    default: dev
  application:
    name: bookmall-order
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ""
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false
