bookmall:
  jwt:
    secret: bookmall-dev-jwt-secret-key-32b!
  catalog-base-url: ${BOOKMALL_CATALOG_BASE_URL:}
  notification-base-url: http://localhost:8084
  pay-timeout: 1m

spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:postgresql://localhost:5432/bookmall_order
    username: bookmall_order_app
    password: bookmall_order_dev

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: true
