bookmall:
  jwt:
    secret: ${BOOKMALL_JWT_SECRET}

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bookmall_user
    username: bookmall_user_app
    password: ${BOOKMALL_USER_DB_PASSWORD}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
      export:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
