server:
  port: 8081

spring:
  profiles:
    default: dev
  application:
    name: bookmall-user
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false
