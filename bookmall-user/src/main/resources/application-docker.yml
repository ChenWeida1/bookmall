# Compose / 容器内配置：数据源与密钥由环境变量注入。
server:
  port: 8081

bookmall:
  jwt:
    secret: ${BOOKMALL_JWT_SECRET}

spring:
  cloud:
    nacos:
      discovery:
        enabled: ${BOOKMALL_NACOS_ENABLED:true}
        server-addr: ${BOOKMALL_NACOS_ADDR:nacos:8848}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
