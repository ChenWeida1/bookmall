# 基础设施：Postgres / Redis / RabbitMQ（单副本，仅本地演示）。
# 端口：Postgres 5432、Redis 6379、RabbitMQ 5672。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmall-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookmall
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bookmall
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: bookmall
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: bookmall-secret
                  key: BOOKMALL_RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: bookmall-secret
                  key: BOOKMALL_RABBITMQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: bookmall
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: mgmt
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seata
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels: { app: seata }
  template:
    metadata:
      labels: { app: seata }
    spec:
      containers:
        - name: seata
          image: apache/seata-server:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
            - containerPort: 7091
          env:
            - name: SEATA_PORT
              value: "8091"
            - name: SEATA_STORE_DB_URL
              value: jdbc:postgresql://postgres:5432/bookmall_seata
            - name: SEATA_STORE_DB_USER
              value: bookmall_seata_app
            - name: SEATA_STORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmall-secret
                  key: BOOKMALL_SEATA_DB_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /seata-server/resources/application.yml
              subPath: application.yml
      volumes:
        - name: config
          configMap:
            name: seata-config
---
apiVersion: v1
kind: Service
metadata:
  name: seata
  namespace: bookmall
spec:
  selector: { app: seata }
  ports:
    - name: tc
      port: 8091
      targetPort: 8091
