# 非敏感配置与演示用 Secret（口令仅本地演示，生产请改）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookmall-config
  namespace: bookmall
data:
  BOOKMALL_REDIS_HOST: redis
  BOOKMALL_REDIS_PORT: "6379"
  BOOKMALL_RABBITMQ_HOST: rabbitmq
  BOOKMALL_RABBITMQ_PORT: "5672"
  BOOKMALL_CATALOG_BASE_URL: http://catalog:8082
  BOOKMALL_NOTIFICATION_BASE_URL: http://notification:8084
  BOOKMALL_USER_URI: http://user:8081
  BOOKMALL_CATALOG_URI: http://catalog:8082
  BOOKMALL_ORDER_URI: http://order:8083
  BOOKMALL_NOTIFICATION_URI: http://notification:8084
  BOOKMALL_ASSISTANT_URI: http://assistant:8085
---
apiVersion: v1
kind: Secret
metadata:
  name: bookmall-secret
  namespace: bookmall
type: Opaque
stringData:
  BOOKMALL_JWT_SECRET: bookmall-dev-jwt-secret-key-32b!
  BOOKMALL_RABBITMQ_USER: guest
  BOOKMALL_RABBITMQ_PASSWORD: guest
  BOOKMALL_USER_DB_PASSWORD: bookmall_user_dev
  BOOKMALL_BOOK_DB_PASSWORD: bookmall_book_dev
  BOOKMALL_ORDER_DB_PASSWORD: bookmall_order_dev
  BOOKMALL_NOTIFICATION_DB_PASSWORD: bookmall_notification_dev
  BOOKMALL_ASSISTANT_DB_PASSWORD: bookmall_assistant_dev
  AI_API_KEY: ""
  POSTGRES_PASSWORD: postgres
