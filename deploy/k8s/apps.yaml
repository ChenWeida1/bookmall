# 业务五服务。镜像需先本地 docker build 并导入 Kind/Desktop。
# 网关 NodePort 30080 -> 8080，浏览器访问 http://localhost:30080。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: bookmall
spec:
  replicas: 1
  selector:
    matchLabels: { app: user }
  template:
    metadata:
      labels: { app: user }
    spec:
      containers:
        - name: user
          image: bookmall-user:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: BOOKMALL_NACOS_ENABLED
              value: "false"
            - name: BOOKMALL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: bookmall-secret, key: BOOKMALL_JWT_SECRET } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bookmall_user
            - name: SPRING_DATASOURCE_USERNAME
              value: bookmall_user_app
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: bookmall-secret, key: BOOKMALL_USER_DB_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: bookmall
spec:
  selector: { app: user }
  ports: [{ port: 8081, targetPort: 8081 }]
---
